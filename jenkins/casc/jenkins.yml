jenkins:
  systemMessage: "CICD Server Management System"
  numExecutors: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${ADMIN_USER}"
          password: "${ADMIN_PASSWORD}"

  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${ADMIN_USER}"
            permissions:
              - "Overall/Administer"

jobs:
  - script: |
      pipelineJob('testes-python') {
          definition {
              cpsScm {
                  scm {
                      git {
                          remote {
                              url('https://github.com/Guilherme-souzae/REST-Deployer.git')
                          }
                          branch('*/main')
                      }
                  }
                  scriptPath('jenkins/Jenkinsfile')
                  lightweight()
              }
          }
      }
