
jenkins:
  systemMessage: "CICD Server Management System"
  numExecutors: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "CHANGEME"
          password: "CHANGEME"

  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "CHANGEME"
            permissions:
              - "Overall/Administer"

jobs:
  - script: |
      pipelineJob('main-pipeline') {
          definition {
              cpsScm {
                  scm {
                      git {
                          remote {
                              url('https://github.com/Guilherme-souzae/REST-Deployer.git')
                          }
                          branch('*/main')
                      }
                  }
                  scriptPath('jenkins/Jenkinsfile')
                  lightweight()
              }
          }
      }
