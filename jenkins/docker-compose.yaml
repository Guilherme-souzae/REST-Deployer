services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: meu-jenkins:dev
    container_name: jenkins-local
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      ADMIN_USER: "CHANGEME"
      ADMIN_PASSWORD: "CHANGEME"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc:/var/jenkins_casc:ro

volumes:
  jenkins_home: