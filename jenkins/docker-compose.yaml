services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-jenkins:dev
    container_name: jenkins-local
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
    volumes:
      - /var/jenkins_home:/var/jenkins_home
      - ./casc:/var/jenkins_casc:ro
      - /var/run/docker.sock:/var/run/docker.sock